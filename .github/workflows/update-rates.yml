name: Update Rates

on:
  schedule:
    - cron: '15 0 * * *'    # scheduled for 00:15 UTC — compensating ~4.5h for observed GitHub queue delay, targeting actual fire near 10:15 AM LK (UTC+5:30)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch rates
        run: python3 fetch_rates.py > rates.json

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || git commit -m "Update rates $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
